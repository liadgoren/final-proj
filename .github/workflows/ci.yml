name: CI

on:
  pull_request:
    branches: [main]
  push: {}

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: appflask/requirements.txt

      - name: Install dependencies
        working-directory: appflask
        run: |
          pip install -r requirements.txt
          pip install flake8

      - name: Lint (flake8)
        working-directory: appflask
        run: flake8 app.py test_app.py --max-line-length=100

      - name: Unit tests
        working-directory: appflask
        run: python -m unittest discover -s . -p "test_app.py" -v

  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bandit
        run: |
          pip install bandit
          bandit -r appflask -f screen --severity-level medium

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r appflask/requirements.txt

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  iac-scan:
    name: IaC scan (tfsec + checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: Terraform
      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: Terraform
          quiet: true

  docker-build-and-scan:
    name: Docker build + image scan (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: appflask
          push: false
          tags: appflask:ci
          load: true

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: appflask:ci
          format: table
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
